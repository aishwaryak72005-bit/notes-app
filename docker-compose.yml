version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: technotes_db
    restart: always
    environment:
      MYSQL_DATABASE: technotes_db
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_USER: technotes_user
      MYSQL_PASSWORD: securepassword123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: technotes_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python seed_data.py &&
             python seed_more_quizzes.py &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      - SECRET_KEY=production-secure-random-key-replace-this
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DB_NAME=technotes_db
      - DB_USER=technotes_user
      - DB_PASSWORD=securepassword123
      - DB_HOST=db
      - DB_PORT=3306
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/
    container_name: technotes_frontend
    restart: always
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: technotes_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  static_volume:
  media_volume:
